<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0071ce">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WM Productos">
    <title>Productos Walmart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #0071ce 0%, #004c8c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0,113,206,0.3);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .scanner-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .scan-btn {
            width: 100%;
            padding: 18px;
            background: #0071ce;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,113,206,0.2);
        }

        .scan-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px rgba(0,113,206,0.2);
        }

        .manual-entry-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #0071ce;
            border: 2px solid #0071ce;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .manual-entry-btn:active {
            transform: scale(0.98);
            background: #f0f8ff;
        }

        #reader {
            width: 100%;
            margin: 16px 0;
            display: none;
        }

        #reader video {
            width: 100% !important;
            border-radius: 8px;
        }

        .form-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
            margin-bottom: 20px;
        }

        .form-section.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0071ce;
        }

        .form-group input[readonly] {
            background: #f9f9f9;
            color: #666;
        }

        .calculated {
            background: #e8f5e9 !important;
            font-weight: 700;
            color: #2e7d32;
            font-size: 18px;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(76,175,80,0.3);
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .cancel-btn {
            width: 100%;
            padding: 14px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .cancel-btn:active {
            transform: scale(0.98);
        }

        .products-list {
            margin-top: 20px;
        }

        .product-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .product-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            flex: 1;
            line-height: 1.3;
        }

        .product-profit {
            font-size: 20px;
            font-weight: 700;
            color: #4caf50;
            margin-left: 10px;
            white-space: nowrap;
        }

        .product-profit.negative {
            color: #f44336;
        }

        .product-upc {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            font-weight: 500;
            color: #555;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .edit-btn {
            background: #2196f3;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .edit-btn:active, .delete-btn:active {
            transform: scale(0.95);
        }

        .search-result-item {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #0071ce;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: #f0f8ff;
        }

        .search-result-item:active {
            transform: scale(0.98);
        }

        .search-result-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .search-result-upc {
            font-size: 12px;
            color: #666;
            font-family: 'Courier New', monospace;
        }

        .no-results {
            text-align: center;
            padding: 16px;
            color: #999;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: transform 0.3s;
            max-width: 90%;
            text-align: center;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification.success {
            border-left: 4px solid #4caf50;
        }

        .notification.error {
            border-left: 4px solid #f44336;
        }

        .stats-bar {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #0071ce;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                padding-bottom: 80px;
            }

            .header h1 {
                font-size: 20px;
            }

            .product-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Productos Walmart</h1>
            <p>Gestiona tu inventario fácilmente</p>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Productos</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalProfit">$0.00</div>
                <div class="stat-label">Utilidad Total</div>
            </div>
        </div>

        <div style="background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;" id="migrationBox">
            <h3 style="margin-bottom: 12px; color: #333; font-size: 16px;">🔄 Migrar Datos</h3>
            <button onclick="exportData()" style="width: 100%; padding: 12px; background: #2196f3; color: white; border: none; border-radius: 8px; font-weight: 600; margin-bottom: 8px;">
                📤 Exportar Productos
            </button>
            <button onclick="document.getElementById('importFile').click()" style="width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 8px; font-weight: 600;">
                📥 Importar Productos
            </button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        </div>

        <div class="scanner-section">
            <button class="scan-btn" id="scanBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <line x1="12" y1="9" x2="12" y2="15"/>
                </svg>
                Escanear Código de Barras
            </button>
            <button class="manual-entry-btn" id="manualBtn">
                ✏️ Ingresar Manualmente
            </button>
            <div style="margin-top: 16px;">
                <input type="text" id="searchInput" placeholder="🔍 Buscar producto por nombre..." style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px;">
                <div id="searchResults" style="margin-top: 8px;"></div>
            </div>
            <div id="reader"></div>
            <button class="cancel-btn" id="stopScanBtn" style="display: none;">❌ Cancelar Escaneo</button>
        </div>

        <div class="form-section" id="formSection">
            <h2>📝 Datos del Producto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label>UPC / Código de Barras</label>
                    <input type="text" id="upc" required inputmode="numeric">
                </div>
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Precio de Venta ($)</label>
                    <input type="number" step="0.01" id="precioVenta" required inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Valor Unitario - Costo ($)</label>
                    <input type="number" step="0.01" id="vrUnit" required inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Descuento (%)</label>
                    <input type="number" step="0.01" id="descuentoPercent" value="0" inputmode="decimal" placeholder="Ej: 10 para 10%">
                </div>
                <div class="form-group">
                    <label>Descuento ($)</label>
                    <input type="text" id="descuento" readonly class="calculated">
                </div>
                <div class="form-group">
                    <label>Impuestos (%)</label>
                    <input type="number" step="0.01" id="taxesPercent" value="0" inputmode="decimal" placeholder="Ej: 7 para 7%">
                </div>
                <div class="form-group">
                    <label>Impuestos ($)</label>
                    <input type="text" id="taxes" readonly class="calculated">
                </div>
                <div class="form-group">
                    <label>📊 Subtotal (Base - Descuento + Taxes)</label>
                    <input type="text" id="subtotal" readonly class="calculated">
                </div>
                <div class="form-group">
                    <label>Walmart Fee (%)</label>
                    <input type="number" step="0.01" id="walmartFeePercent" value="0" inputmode="decimal" placeholder="Ej: 15 para 15%">
                </div>
                <div class="form-group">
                    <label>Walmart Fee ($)</label>
                    <input type="text" id="walmartFee" readonly class="calculated">
                </div>
                <div class="form-group">
                    <label>Fulfillment ($)</label>
                    <input type="number" step="0.01" id="fulfillment" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Inbound ($)</label>
                    <input type="number" step="0.01" id="inbound" value="0.70" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Otras Tarifas ($)</label>
                    <input type="number" step="0.01" id="otherFees" value="0.50" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>💰 Utilidad ($)</label>
                    <input type="text" id="utilidad" readonly class="calculated">
                </div>
                <button type="submit" class="save-btn">💾 Guardar Producto</button>
                <button type="button" class="cancel-btn" id="cancelBtn">Cancelar</button>
            </form>
        </div>

        <div class="products-list" id="productsList"></div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        const STORAGE_KEY = 'walmart_products';
        let html5QrCode = null;
        let isScanning = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            setupFormListeners();
            updateStats();
            setupSearch();
            checkMigrationBox();
        });

        // Configurar búsqueda
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                const resultsContainer = document.getElementById('searchResults');
                
                if (query.length === 0) {
                    resultsContainer.innerHTML = '';
                    return;
                }
                
                const products = getProducts();
                const filtered = products.filter(p => 
                    p.nombre.toLowerCase().includes(query) ||
                    p.upc.includes(query)
                );
                
                if (filtered.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">No se encontraron productos</div>';
                    return;
                }
                
                resultsContainer.innerHTML = filtered.map(product => `
                    <div class="search-result-item" onclick="selectSearchResult('${product.upc}')">
                        <div class="search-result-name">${product.nombre}</div>
                        <div class="search-result-upc">UPC: ${product.upc} • $${product.utilidad.toFixed(2)} utilidad</div>
                    </div>
                `).join('');
            });
        }

        function selectSearchResult(upc) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
            editProduct(upc);
        }

        document.getElementById('manualBtn').addEventListener('click', () => {
            document.getElementById('formSection').classList.add('active');
            document.getElementById('upc').focus();
            document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (isScanning) return;
            
            try {
                html5QrCode = new Html5Qrcode("reader");
                const cameras = await Html5Qrcode.getCameras();
                
                if (cameras && cameras.length > 0) {
                    isScanning = true;
                    document.getElementById('reader').style.display = 'block';
                    document.getElementById('stopScanBtn').style.display = 'block';
                    document.getElementById('scanBtn').style.display = 'none';
                    document.getElementById('manualBtn').style.display = 'none';
                    
                    // Preferir cámara trasera
                    const cameraId = cameras.length > 1 ? cameras[1].id : cameras[0].id;
                    
                    html5QrCode.start(
                        cameraId,
                        {
                            fps: 10,
                            qrbox: { width: 250, height: 150 }
                        },
                        (decodedText) => {
                            document.getElementById('upc').value = decodedText;
                            stopScanning();
                            loadProductData(decodedText);
                            showNotification(`✅ Código: ${decodedText}`, 'success');
                            document.getElementById('formSection').classList.add('active');
                            document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
                        },
                        (errorMessage) => {
                            // Ignorar errores de no encontrar código
                        }
                    ).catch(err => {
                        showNotification('Error al iniciar cámara', 'error');
                        console.error(err);
                        stopScanning();
                    });
                } else {
                    showNotification('No se encontró cámara', 'error');
                }
            } catch (err) {
                showNotification('Error al acceder a la cámara', 'error');
                console.error(err);
            }
        });

        document.getElementById('stopScanBtn').addEventListener('click', stopScanning);

        function stopScanning() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('stopScanBtn').style.display = 'none';
                    document.getElementById('scanBtn').style.display = 'flex';
                    document.getElementById('manualBtn').style.display = 'block';
                }).catch(err => console.error(err));
            }
        }

        function setupFormListeners() {
            const inputs = ['precioVenta', 'vrUnit', 'descuentoPercent', 'taxesPercent', 'walmartFeePercent', 'fulfillment', 'inbound', 'otherFees'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', calculateProfit);
            });
        }

        function calculateProfit() {
            const precioVenta = parseFloat(document.getElementById('precioVenta').value) || 0;
            const vrUnit = parseFloat(document.getElementById('vrUnit').value) || 0;
            const descuentoPercent = parseFloat(document.getElementById('descuentoPercent').value) || 0;
            const taxesPercent = parseFloat(document.getElementById('taxesPercent').value) || 0;
            const walmartFeePercent = parseFloat(document.getElementById('walmartFeePercent').value) || 0;
            const fulfillment = parseFloat(document.getElementById('fulfillment').value) || 0;
            const inbound = parseFloat(document.getElementById('inbound').value) || 0;
            const otherFees = parseFloat(document.getElementById('otherFees').value) || 0;

            // Calcular Descuento en base al costo (vrUnit) y el porcentaje
            const descuento = (vrUnit * descuentoPercent) / 100;
            document.getElementById('descuento').value = '$' + descuento.toFixed(2);

            // Calcular Impuestos en base al (costo - descuento) y el porcentaje
            const baseAfterDiscount = vrUnit - descuento;
            const taxes = (baseAfterDiscount * taxesPercent) / 100;
            document.getElementById('taxes').value = '$' + taxes.toFixed(2);

            // Calcular subtotal: base - descuento + taxes
            const subtotal = vrUnit - descuento + taxes;
            document.getElementById('subtotal').value = '$' + subtotal.toFixed(2);

            // Calcular Walmart Fee en base al precio de venta y el porcentaje
            const walmartFee = (precioVenta * walmartFeePercent) / 100;
            document.getElementById('walmartFee').value = '$' + walmartFee.toFixed(2);

            // Calcular utilidad usando el subtotal
            const utilidad = precioVenta - subtotal - walmartFee - fulfillment - inbound - otherFees;
            document.getElementById('utilidad').value = '$' + utilidad.toFixed(2);
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const utilidadValue = document.getElementById('utilidad').value.replace('$', '');
            const subtotalValue = document.getElementById('subtotal').value.replace('$', '');
            const descuentoValue = document.getElementById('descuento').value.replace('$', '');
            const taxesValue = document.getElementById('taxes').value.replace('$', '');
            const walmartFeeValue = document.getElementById('walmartFee').value.replace('$', '');
            
            const product = {
                upc: document.getElementById('upc').value,
                nombre: document.getElementById('nombre').value,
                precioVenta: parseFloat(document.getElementById('precioVenta').value),
                vrUnit: parseFloat(document.getElementById('vrUnit').value),
                descuentoPercent: parseFloat(document.getElementById('descuentoPercent').value) || 0,
                descuento: parseFloat(descuentoValue),
                taxesPercent: parseFloat(document.getElementById('taxesPercent').value) || 0,
                taxes: parseFloat(taxesValue),
                subtotal: parseFloat(subtotalValue),
                walmartFeePercent: parseFloat(document.getElementById('walmartFeePercent').value) || 0,
                walmartFee: parseFloat(walmartFeeValue),
                fulfillment: parseFloat(document.getElementById('fulfillment').value) || 0,
                inbound: parseFloat(document.getElementById('inbound').value) || 0,
                otherFees: parseFloat(document.getElementById('otherFees').value) || 0,
                utilidad: parseFloat(utilidadValue),
                updatedAt: new Date().toISOString()
            };

            const products = getProducts();
            const existingIndex = products.findIndex(p => p.upc === product.upc);

            if (existingIndex !== -1) {
                products[existingIndex] = product;
                showNotification('✅ Producto actualizado', 'success');
            } else {
                products.push(product);
                showNotification('✅ Producto creado', 'success');
            }

            saveProducts(products);
            loadProducts();
            updateStats();
            resetForm();
        });

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        function loadProductData(upc) {
            const products = getProducts();
            const product = products.find(p => p.upc === upc);
            
            if (product) {
                document.getElementById('nombre').value = product.nombre;
                document.getElementById('precioVenta').value = product.precioVenta;
                document.getElementById('vrUnit').value = product.vrUnit;
                document.getElementById('descuentoPercent').value = product.descuentoPercent || 0;
                document.getElementById('taxesPercent').value = product.taxesPercent || 0;
                document.getElementById('walmartFeePercent').value = product.walmartFeePercent || 0;
                document.getElementById('fulfillment').value = product.fulfillment;
                document.getElementById('inbound').value = product.inbound;
                document.getElementById('otherFees').value = product.otherFees;
                calculateProfit();
                showNotification('📝 Editando producto existente', 'success');
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('formSection').classList.remove('active');
            document.getElementById('utilidad').value = '';
        }

        function getProducts() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveProducts(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        function updateStats() {
            const products = getProducts();
            if (products.length > 0) {
                document.getElementById('statsBar').style.display = 'grid';
                document.getElementById('totalProducts').textContent = products.length;
                const totalProfit = products.reduce((sum, p) => sum + p.utilidad, 0);
                document.getElementById('totalProfit').textContent = '$' + totalProfit.toFixed(2);
                document.getElementById('totalProfit').style.color = totalProfit >= 0 ? '#4caf50' : '#f44336';
            } else {
                document.getElementById('statsBar').style.display = 'none';
            }
        }

        function loadProducts() {
            const products = getProducts();
            const container = document.getElementById('productsList');
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 3h15v13H1zM16 8h5l3 5v5h-8v-5z"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                        <p style="font-size: 16px; font-weight: 600;">No hay productos</p>
                        <p style="font-size: 14px; margin-top: 8px;">Escanea o ingresa tu primer producto</p>
                    </div>
                `;
                return;
            }

            products.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-header">
                        <div style="flex: 1;">
                            <div class="product-name">${product.nombre}</div>
                            <div class="product-upc">UPC: ${product.upc}</div>
                        </div>
                        <div class="product-profit ${product.utilidad < 0 ? 'negative' : ''}">
                            $${product.utilidad.toFixed(2)}
                        </div>
                    </div>
                    <div class="product-details">
                        <div class="detail-item">
                            <span class="detail-label">💵 Venta:</span>
                            <span>$${product.precioVenta.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">💰 Costo:</span>
                            <span>$${product.vrUnit.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🏪 WM Fee:</span>
                            <span>$${product.walmartFee.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">📦 Fulfill:</span>
                            <span>$${product.fulfillment.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🚚 Inbound:</span>
                            <span>$${product.inbound.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">📊 Taxes:</span>
                            <span>$${product.taxes.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="edit-btn" onclick="editProduct('${product.upc}')">✏️ Editar</button>
                        <button class="delete-btn" onclick="deleteProduct('${product.upc}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function editProduct(upc) {
            const products = getProducts();
            const product = products.find(p => p.upc === upc);
            
            if (product) {
                document.getElementById('upc').value = product.upc;
                document.getElementById('nombre').value = product.nombre;
                document.getElementById('precioVenta').value = product.precioVenta;
                document.getElementById('vrUnit').value = product.vrUnit;
                document.getElementById('descuentoPercent').value = product.descuentoPercent || 0;
                document.getElementById('taxesPercent').value = product.taxesPercent || 0;
                document.getElementById('walmartFeePercent').value = product.walmartFeePercent || 0;
                document.getElementById('fulfillment').value = product.fulfillment;
                document.getElementById('inbound').value = product.inbound;
                document.getElementById('otherFees').value = product.otherFees;
                calculateProfit();
                
                document.getElementById('formSection').classList.add('active');
                document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function deleteProduct(upc) {
            if (confirm('¿Eliminar este producto?')) {
                const products = getProducts();
                const filtered = products.filter(p => p.upc !== upc);
                saveProducts(filtered);
                loadProducts();
                updateStats();
                showNotification('🗑️ Producto eliminado', 'success');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Mostrar caja de migración si no hay productos
        function checkMigrationBox() {
            const products = getProducts();
            if (products.length === 0) {
                document.getElementById('migrationBox').style.display = 'block';
            } else {
                document.getElementById('migrationBox').style.display = 'none';
            }
        }

        // Exportar datos
        function exportData() {
            const products = getProducts();
            if (products.length === 0) {
                showNotification('No hay productos para exportar', 'error');
                return;
            }
            
            const dataStr = JSON.stringify(products, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'walmart-productos-' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            URL.revokeObjectURL(url);
            showNotification('✅ Productos exportados', 'success');
        }

        // Importar datos
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const products = JSON.parse(e.target.result);
                    if (!Array.isArray(products)) {
                        showNotification('Archivo inválido', 'error');
                        return;
                    }
                    saveProducts(products);
                    loadProducts();
                    updateStats();
                    checkMigrationBox();
                    showNotification(`✅ ${products.length} productos importados`, 'success');
                } catch (err) {
                    showNotification('Error al importar archivo', 'error');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
