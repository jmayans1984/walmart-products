<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0071ce">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WM Productos">
    <title>Productos Walmart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #0071ce 0%, #004c8c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0,113,206,0.3);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .scanner-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .scan-btn {
            width: 100%;
            padding: 18px;
            background: #0071ce;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,113,206,0.2);
        }

        .scan-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px rgba(0,113,206,0.2);
        }

        .manual-entry-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #0071ce;
            border: 2px solid #0071ce;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .manual-entry-btn:active {
            transform: scale(0.98);
            background: #f0f8ff;
        }

        .form-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
            margin-bottom: 20px;
        }

        .form-section.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0071ce;
        }

        .form-group input[readonly] {
            background: #f9f9f9;
            color: #666;
        }

        .calculated {
            background: #e8f5e9 !important;
            font-weight: 700;
            color: #2e7d32;
            font-size: 18px;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(76,175,80,0.3);
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .cancel-btn {
            width: 100%;
            padding: 14px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .cancel-btn:active {
            transform: scale(0.98);
        }

        .products-list {
            margin-top: 20px;
        }

        .product-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .product-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            flex: 1;
            line-height: 1.3;
        }

        .product-profit {
            font-size: 20px;
            font-weight: 700;
            color: #4caf50;
            margin-left: 10px;
            white-space: nowrap;
        }

        .product-profit.negative {
            color: #f44336;
        }

        .product-upc {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            font-weight: 500;
            color: #555;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .edit-btn {
            background: #2196f3;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .edit-btn:active, .delete-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80px;
            border: 3px solid #4caf50;
            border-left: none;
            border-right: none;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0; }
            50% { top: calc(100% - 2px); }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: transform 0.3s;
            max-width: 90%;
            text-align: center;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification.success {
            border-left: 4px solid #4caf50;
        }

        .notification.error {
            border-left: 4px solid #f44336;
        }

        .stats-bar {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #0071ce;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                padding-bottom: 80px;
            }

            .header h1 {
                font-size: 20px;
            }

            .product-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Productos Walmart</h1>
            <p>Gestiona tu inventario fácilmente</p>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Productos</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalProfit">$0.00</div>
                <div class="stat-label">Utilidad Total</div>
            </div>
        </div>

        <div class="scanner-section">
            <button class="scan-btn" id="scanBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <line x1="12" y1="9" x2="12" y2="15"/>
                </svg>
                Escanear Código de Barras
            </button>
            <button class="manual-entry-btn" id="manualBtn">
                ✏️ Ingresar Manualmente
            </button>
            <div id="videoContainer" style="display: none;">
                <div class="video-container">
                    <video id="video" playsinline autoplay></video>
                    <div class="scanner-overlay">
                        <div class="scanner-line"></div>
                    </div>
                </div>
                <button class="cancel-btn" id="stopScanBtn">❌ Cancelar Escaneo</button>
            </div>
        </div>

        <div class="form-section" id="formSection">
            <h2>📝 Datos del Producto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label>UPC / Código de Barras</label>
                    <input type="text" id="upc" required inputmode="numeric">
                </div>
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Precio de Venta ($)</label>
                    <input type="number" step="0.01" id="precioVenta" required inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Valor Unitario - Costo ($)</label>
                    <input type="number" step="0.01" id="vrUnit" required inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Descuento ($)</label>
                    <input type="number" step="0.01" id="descuento" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Impuestos ($)</label>
                    <input type="number" step="0.01" id="taxes" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Walmart Fee ($)</label>
                    <input type="number" step="0.01" id="walmartFee" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Fulfillment ($)</label>
                    <input type="number" step="0.01" id="fulfillment" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Inbound ($)</label>
                    <input type="number" step="0.01" id="inbound" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>Otras Tarifas ($)</label>
                    <input type="number" step="0.01" id="otherFees" value="0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label>💰 Utilidad ($)</label>
                    <input type="text" id="utilidad" readonly class="calculated">
                </div>
                <button type="submit" class="save-btn">💾 Guardar Producto</button>
                <button type="button" class="cancel-btn" id="cancelBtn">Cancelar</button>
            </form>
        </div>

        <div class="products-list" id="productsList">
            <!-- Productos cargados dinámicamente -->
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest"></script>
    <script>
        const STORAGE_KEY = 'walmart_products';
        let codeReader = null;

        // Cargar productos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            setupFormListeners();
            updateStats();
        });

        // Botón de ingreso manual
        document.getElementById('manualBtn').addEventListener('click', () => {
            document.getElementById('formSection').classList.add('active');
            document.getElementById('upc').focus();
            document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
        });

        // Escaneo de código de barras
        document.getElementById('scanBtn').addEventListener('click', async () => {
            try {
                codeReader = new ZXing.BrowserMultiFormatReader();
                const videoInputDevices = await codeReader.listVideoInputDevices();
                
                if (videoInputDevices.length === 0) {
                    showNotification('No se encontró cámara disponible', 'error');
                    return;
                }

                // Preferir cámara trasera en móviles
                const selectedDeviceId = videoInputDevices.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('rear') ||
                    device.label.toLowerCase().includes('trasera')
                )?.deviceId || videoInputDevices[0].deviceId;

                document.getElementById('videoContainer').style.display = 'block';
                document.querySelector('.scan-btn').style.display = 'none';
                document.querySelector('.manual-entry-btn').style.display = 'none';

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        const code = result.text;
                        document.getElementById('upc').value = code;
                        stopScanning();
                        loadProductData(code);
                        showNotification(`✅ Código: ${code}`, 'success');
                        document.getElementById('formSection').classList.add('active');
                        document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
                    }
                });
            } catch (err) {
                console.error(err);
                showNotification('Error al acceder a la cámara', 'error');
                stopScanning();
            }
        });

        document.getElementById('stopScanBtn').addEventListener('click', stopScanning);

        function stopScanning() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('videoContainer').style.display = 'none';
            document.querySelector('.scan-btn').style.display = 'flex';
            document.querySelector('.manual-entry-btn').style.display = 'block';
        }

        // Configurar listeners del formulario
        function setupFormListeners() {
            const inputs = ['precioVenta', 'vrUnit', 'descuento', 'taxes', 'walmartFee', 'fulfillment', 'inbound', 'otherFees'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', calculateProfit);
            });
        }

        // Calcular utilidad
        function calculateProfit() {
            const precioVenta = parseFloat(document.getElementById('precioVenta').value) || 0;
            const vrUnit = parseFloat(document.getElementById('vrUnit').value) || 0;
            const descuento = parseFloat(document.getElementById('descuento').value) || 0;
            const taxes = parseFloat(document.getElementById('taxes').value) || 0;
            const walmartFee = parseFloat(document.getElementById('walmartFee').value) || 0;
            const fulfillment = parseFloat(document.getElementById('fulfillment').value) || 0;
            const inbound = parseFloat(document.getElementById('inbound').value) || 0;
            const otherFees = parseFloat(document.getElementById('otherFees').value) || 0;

            const utilidad = precioVenta - vrUnit - descuento - taxes - walmartFee - fulfillment - inbound - otherFees;
            document.getElementById('utilidad').value = '$' + utilidad.toFixed(2);
        }

        // Guardar producto
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const utilidadValue = document.getElementById('utilidad').value.replace('$', '');
            
            const product = {
                upc: document.getElementById('upc').value,
                nombre: document.getElementById('nombre').value,
                precioVenta: parseFloat(document.getElementById('precioVenta').value),
                vrUnit: parseFloat(document.getElementById('vrUnit').value),
                descuento: parseFloat(document.getElementById('descuento').value) || 0,
                taxes: parseFloat(document.getElementById('taxes').value) || 0,
                walmartFee: parseFloat(document.getElementById('walmartFee').value) || 0,
                fulfillment: parseFloat(document.getElementById('fulfillment').value) || 0,
                inbound: parseFloat(document.getElementById('inbound').value) || 0,
                otherFees: parseFloat(document.getElementById('otherFees').value) || 0,
                utilidad: parseFloat(utilidadValue),
                updatedAt: new Date().toISOString()
            };

            const products = getProducts();
            const existingIndex = products.findIndex(p => p.upc === product.upc);

            if (existingIndex !== -1) {
                products[existingIndex] = product;
                showNotification('✅ Producto actualizado', 'success');
            } else {
                products.push(product);
                showNotification('✅ Producto creado', 'success');
            }

            saveProducts(products);
            loadProducts();
            updateStats();
            resetForm();
        });

        // Cancelar edición
        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        // Cargar datos del producto si existe
        function loadProductData(upc) {
            const products = getProducts();
            const product = products.find(p => p.upc === upc);
            
            if (product) {
                document.getElementById('nombre').value = product.nombre;
                document.getElementById('precioVenta').value = product.precioVenta;
                document.getElementById('vrUnit').value = product.vrUnit;
                document.getElementById('descuento').value = product.descuento;
                document.getElementById('taxes').value = product.taxes;
                document.getElementById('walmartFee').value = product.walmartFee;
                document.getElementById('fulfillment').value = product.fulfillment;
                document.getElementById('inbound').value = product.inbound;
                document.getElementById('otherFees').value = product.otherFees;
                calculateProfit();
                showNotification('📝 Editando producto existente', 'success');
            }
        }

        // Resetear formulario
        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('formSection').classList.remove('active');
            document.getElementById('utilidad').value = '';
        }

        // Funciones de almacenamiento
        function getProducts() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveProducts(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        // Actualizar estadísticas
        function updateStats() {
            const products = getProducts();
            if (products.length > 0) {
                document.getElementById('statsBar').style.display = 'grid';
                document.getElementById('totalProducts').textContent = products.length;
                const totalProfit = products.reduce((sum, p) => sum + p.utilidad, 0);
                document.getElementById('totalProfit').textContent = '$' + totalProfit.toFixed(2);
                document.getElementById('totalProfit').style.color = totalProfit >= 0 ? '#4caf50' : '#f44336';
            } else {
                document.getElementById('statsBar').style.display = 'none';
            }
        }

        // Cargar y mostrar productos
        function loadProducts() {
            const products = getProducts();
            const container = document.getElementById('productsList');
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 3h15v13H1zM16 8h5l3 5v5h-8v-5z"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                        <p style="font-size: 16px; font-weight: 600;">No hay productos</p>
                        <p style="font-size: 14px; margin-top: 8px;">Escanea o ingresa tu primer producto</p>
                    </div>
                `;
                return;
            }

            // Ordenar por fecha de actualización (más reciente primero)
            products.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-header">
                        <div style="flex: 1;">
                            <div class="product-name">${product.nombre}</div>
                            <div class="product-upc">UPC: ${product.upc}</div>
                        </div>
                        <div class="product-profit ${product.utilidad < 0 ? 'negative' : ''}">
                            $${product.utilidad.toFixed(2)}
                        </div>
                    </div>
                    <div class="product-details">
                        <div class="detail-item">
                            <span class="detail-label">💵 Venta:</span>
                            <span>$${product.precioVenta.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">💰 Costo:</span>
                            <span>$${product.vrUnit.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🏪 WM Fee:</span>
                            <span>$${product.walmartFee.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">📦 Fulfill:</span>
                            <span>$${product.fulfillment.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🚚 Inbound:</span>
                            <span>$${product.inbound.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">📊 Taxes:</span>
                            <span>$${product.taxes.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="edit-btn" onclick="editProduct('${product.upc}')">✏️ Editar</button>
                        <button class="delete-btn" onclick="deleteProduct('${product.upc}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        // Editar producto
        function editProduct(upc) {
            const products = getProducts();
            const product = products.find(p => p.upc === upc);
            
            if (product) {
                document.getElementById('upc').value = product.upc;
                document.getElementById('nombre').value = product.nombre;
                document.getElementById('precioVenta').value = product.precioVenta;
                document.getElementById('vrUnit').value = product.vrUnit;
                document.getElementById('descuento').value = product.descuento;
                document.getElementById('taxes').value = product.taxes;
                document.getElementById('walmartFee').value = product.walmartFee;
                document.getElementById('fulfillment').value = product.fulfillment;
                document.getElementById('inbound').value = product.inbound;
                document.getElementById('otherFees').value = product.otherFees;
                calculateProfit();
                
                document.getElementById('formSection').classList.add('active');
                document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Eliminar producto
        function deleteProduct(upc) {
            if (confirm('¿Eliminar este producto?')) {
                const products = getProducts();
                const filtered = products.filter(p => p.upc !== upc);
                saveProducts(filtered);
                loadProducts();
                updateStats();
                showNotification('🗑️ Producto eliminado', 'success');
            }
        }

        // Notificaciones
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
